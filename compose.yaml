services:
  postgres:
    image: postgres:16-alpine
    container_name: field-notes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-field_notes}
      POSTGRES_USER: ${DB_USERNAME:-fieldnotes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fieldnotes}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: field-notes-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-field_notes}
      DB_USERNAME: ${DB_USERNAME:-fieldnotes}
      DB_PASSWORD: ${DB_PASSWORD:-fieldnotes}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting the backend}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      # PORT (not SERVER_PORT) — matches application.yml binding ${PORT:8080}
      PORT: ${PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
