spring:
  datasource:
    # Local-dev fallbacks — never rely on these outside of a local developer machine.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/field_notes}
    username: ${DB_USERNAME:fieldnotes}
    password: ${DB_PASSWORD:fieldnotes}
  jpa:
    show-sql: true
  flyway:
    clean-disabled: true

# Local-dev JWT fallback (32-char minimum for JwtProperties validation).
# Must be overridden by JWT_SECRET env var in production.
jwt:
  secret: ${JWT_SECRET:dev-only-secret-at-least-32-characters-long}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    root: INFO
    com.fieldnotes: DEBUG
