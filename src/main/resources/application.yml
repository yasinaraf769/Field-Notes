spring:
  application:
    name: field-notes-backend
  datasource:
    # DB_URL, DB_USERNAME, DB_PASSWORD must be supplied via environment variables.
    # No insecure fallback defaults are provided for production credentials.
    # For local development, set these in .env or as environment variables.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Settings tuned for Neon PostgreSQL, which auto-suspends after ~5 minutes of inactivity.
      # minimum-idle=0 allows the pool to fully drain when the DB suspends.
      minimum-idle: 0
      # max-lifetime < Neon's idle-connection-close interval (~300 s) prevents stale connection errors.
      max-lifetime: 300000
      # connection-timeout: fail fast if Neon is waking up and slow to respond.
      connection-timeout: 30000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Bind to ${PORT} for Render/Railway/Fly.io compatibility; fall back to 8080 locally.
  port: ${PORT:8080}

jwt:
  # JWT_SECRET must be at least 32 characters. No default — the app will refuse to start without it.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"

# Actuator: expose ONLY the health endpoint. Nothing else is published.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
